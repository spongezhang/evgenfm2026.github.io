<div class="container" id="i18_speaker">
    <div class="row m-b-lg">
        <div class="col-lg-12 text-center">
            <div class="navy-line"></div>
            <h1><span data-i18n="speaker.invited_speakers">Invited Speakers</span></h1>
        </div>
    </div>
    <div class="row speaker-row">
        {% for speaker in site.data.index.speaker %}
            <div class="col-sm-4">
              <div class="team-member">
                  <img src="{{ speaker.img | prepend: site.baseurl }}" class="img-responsive img-circle img-small" alt="">
                  <h4>
                  {% if speaker.url %}
                  <a href="{{ speaker.url }}" target="_blank"><span class="navy">{{ speaker.name }}</span></a>
                  {% else %}
                  <span class="navy">{{ speaker.name }}</span>
                  {% endif %}
                  </h4>
                  <p><span data-i18n="speaker.{{ speaker.i18n }}">{{ speaker.desc }}</span></p>
                  <h4>
                  <p><span data-i18n="speaker.{{ speaker.i18n }}" class="navy" >{{ speaker.title }}</span></p>
                  </h4>
                  <p><span data-i18n="speaker.{{ speaker.i18n }}">{{ speaker.abstract }}</span></p>
              </div>
          </div>
      {% endfor %}
    </div>
</div>
<br>
